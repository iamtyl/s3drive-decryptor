name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read


    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package EXE
        run: |
          pyinstaller --onefile --windowed --name "S3DriveDecryptor" main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S3DriveDecryptor-Windows
          path: dist/S3DriveDecryptor.exe
